name: digital_khata
description: "digital_khata clone"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  go_router: ^16.2.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  equatable: ^2.0.5

  # Supabase
  supabase_flutter: ^2.8.0
  qr_flutter: ^4.1.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Biometrics, Platform Services & URL Launching
  local_auth: ^2.3.0
  url_launcher: ^6.3.1

  # PDF & Excel Document Exports
  pdf: ^3.11.1
  excel: ^4.0.6

  # Barcode & Sharing Utilities
  barcode_widget: ^2.0.4
  barcode: ^2.2.8
  share_plus: ^9.0.0
  path_provider: ^2.1.0

  # Utilities
  image_picker: ^1.2.0
  http: ^1.4.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Kalimati
      fonts:
        - asset: assets/fonts/Kalimati.otf